name: Build Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'WallpaperWorldHD_PhoneBuild.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Extract Android project
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip
          unzip -o WallpaperWorldHD_PhoneBuild.zip
          mv WallpaperWorldHD_Premium/* .
          mv WallpaperWorldHD_Premium/.github . 2>/dev/null || true
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WallpaperWorldHD-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
