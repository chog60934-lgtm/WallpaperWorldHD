<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090b16"><title>Wallpaper World HD — Preview</title>
<style>
:root{color-scheme:dark;--bg:#090b16;--panel:#14182a;--muted:#9ba3bc;--accent:#a78bfa}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -15%,#30245d 0,transparent 48%),var(--bg);color:#fff;font-family:Inter,system-ui,sans-serif}header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;padding:14px 16px;background:#090b16eF;backdrop-filter:blur(16px);border-bottom:1px solid #ffffff12}.logo{width:40px;height:40px;border-radius:13px;background:linear-gradient(135deg,#a78bfa,#5426b8);display:grid;place-items:center;font-size:23px}header h1{font-size:17px;margin:0}header p{margin:2px 0 0;color:var(--muted);font-size:11px}.search{margin-left:auto;width:min(44vw,260px);background:#1b2035;border:1px solid #ffffff1a;border-radius:12px;padding:11px 13px;color:white;outline:none}.wrap{max-width:1050px;margin:auto;padding:16px}.intro{display:flex;align-items:end;justify-content:space-between;margin:8px 2px 14px}.intro h2{font-size:22px;margin:0}.intro span{font-size:12px;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card{position:relative;overflow:hidden;border-radius:17px;aspect-ratio:.69;background:#171b2b;border:1px solid #ffffff17;cursor:pointer}.art{position:absolute;inset:0;display:grid;place-items:center;font-size:clamp(54px,12vw,100px);text-shadow:0 8px 35px #0008}.art:after{content:"";position:absolute;inset:45% 0 0;background:linear-gradient(transparent,#070914dc)}.name{position:absolute;bottom:12px;left:13px;z-index:1}.name b{display:block;font-size:14px}.name small{color:#d2c8ff;font-size:10px;letter-spacing:1px}.heart{position:absolute;right:9px;top:9px;z-index:2;border:0;border-radius:50%;width:35px;height:35px;background:#090b1688;color:white;font-size:18px}.empty{grid-column:1/-1;color:var(--muted);padding:30px;text-align:center}.modal{position:fixed;inset:0;background:#000d;display:none;place-items:center;padding:18px;z-index:10}.modal.open{display:grid}.preview{width:min(440px,100%);background:#15192b;border-radius:20px;padding:12px}.preview .card{aspect-ratio:9/16}.actions{display:flex;gap:8px;margin-top:10px}.actions button{flex:1;border:0;border-radius:12px;padding:12px;background:#7552d9;color:white;font-weight:700}.hint{text-align:center;color:var(--muted);font-size:11px;margin:16px 0 28px}@media(min-width:700px){.grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}.wrap{padding:24px}.intro h2{font-size:26px}}
</style></head><body>
<header><div class="logo">▧</div><div><h1>Wallpaper World <span style="color:#bba5ff">HD</span></h1><p>Choose your next wallpaper</p></div><input id="q" class="search" placeholder="⌕ Search..." aria-label="Search wallpapers"></header>
<main class="wrap"><div class="intro"><h2>Wallpapers</h2><span id="count">10 wallpapers</span></div><section class="grid" id="grid"></section><p class="hint">Preview website · Changes here are for browsing and design review. Setting wallpaper requires the Android app.</p></main>
<div class="modal" id="modal"><div class="preview"><div id="large"></div><div class="actions"><button id="close">Close preview</button></div></div></div>
<script>
const data=[
["Cute Teddy","CUTE","🧸","linear-gradient(145deg,#ffb7d5,#b65c9a,#512c70)"],
["Neon Gamer","GAMING","🎮","linear-gradient(145deg,#081b45,#075c8b,#7c2ee8)"],
["Chibi Friends","ANIME","👫","linear-gradient(145deg,#ffcfb7,#ef86b9,#7550bb)"],
["Butterfly Dream","NATURE","🦋","linear-gradient(145deg,#d4a8ff,#6c69cb,#25366f)"],
["Street Style","URBAN","🌃","linear-gradient(145deg,#202637,#50556b,#090d18)"],
["Cute Kitty","CUTE","🐱","linear-gradient(145deg,#ffe0ec,#d28bbd,#76518e)"],
["Couple Sunset","LOVE","🌅","linear-gradient(145deg,#ffbd79,#e45d70,#422c68)"],
["Galaxy Dream","SPACE","🌌","linear-gradient(145deg,#080d31,#4a3194,#bd5ce5)"],
["Supercar Night","CARS","🏎️","linear-gradient(145deg,#111827,#6b263c,#e15d35)"],
["Happy Cloud","PASTEL","☁️","linear-gradient(145deg,#b7e7ff,#c7b5ff,#ffc9e5)"]
];
const grid=document.querySelector('#grid'),q=document.querySelector('#q'),count=document.querySelector('#count'),modal=document.querySelector('#modal'),large=document.querySelector('#large');let fav=new Set();
function card(item){let [name,cat,emoji,bg]=item;return `<article class="card" data-name="${name}" style="background:${bg}"><div class="art">${emoji}</div><button class="heart" aria-label="Favorite">${fav.has(name)?'♥':'♡'}</button><div class="name"><b>${name}</b><small>${cat}</small></div></article>`}
function render(){let rows=data.filter(x=>x[0].toLowerCase().includes(q.value.toLowerCase())||x[1].toLowerCase().includes(q.value.toLowerCase()));grid.innerHTML=rows.map(card).join('')||'<div class="empty">No wallpapers found</div>';count.textContent=rows.length+' wallpapers';grid.querySelectorAll('.card').forEach(el=>{el.addEventListener('click',e=>{if(e.target.closest('.heart')){let n=el.dataset.name;fav.has(n)?fav.delete(n):fav.add(n);render();return}let item=data.find(x=>x[0]===el.dataset.name);large.innerHTML=card(item);large.querySelector('.heart').remove();modal.classList.add('open')})})}
q.addEventListener('input',render);document.querySelector('#close').onclick=()=>modal.classList.remove('open');modal.addEventListener('click',e=>{if(e.target===modal)modal.classList.remove('open')});render();
</script></body></html>
